services:
  - type: web
    name: telegram-link-resolver
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=/opt/render/.cache/ms-playwright python -m playwright install chromium && PYTHONPATH=. pytest -q
    startCommand: PLAYWRIGHT_BROWSERS_PATH=/opt/render/.cache/ms-playwright python -m playwright install chromium && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/.cache/ms-playwright
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MAX_REDIRECTS
        value: "8"
      - key: REQUEST_TIMEOUT
        value: "12"
      - key: BROWSER_WAIT_SECONDS
        value: "20"
      - key: CACHE_TTL_SECONDS
        value: "86400"
      - key: RATE_LIMIT_COUNT
        value: "40"
      - key: RATE_LIMIT_WINDOW
        value: "3600"
      - key: SQLITE_PATH
        value: /tmp/link-resolver.sqlite3
