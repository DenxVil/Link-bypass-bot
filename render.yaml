services:
  - type: web
    name: telegram-link-resolver
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MAX_REDIRECTS
        value: "8"
      - key: REQUEST_TIMEOUT
        value: "12"
      - key: BROWSER_WAIT_SECONDS
        value: "20"
      - key: CACHE_TTL_SECONDS
        value: "86400"
      - key: RATE_LIMIT_COUNT
        value: "40"
      - key: RATE_LIMIT_WINDOW
        value: "3600"
      - key: SQLITE_PATH
        value: /tmp/link-resolver.sqlite3
